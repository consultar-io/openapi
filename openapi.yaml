            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    regiao:
                      type: string
                    numero_registro:
                      type: string
                    categoria:
                      type: string
                    nome_razao_social:
                      type: string
              example:
                - regiao: '01'
                  numero_registro: '1234567'
                  categoria: BIOMÉDICO
                  nome_razao_social: JOÃO SILVA
                - regiao: '01'
                  numero_registro: '1234568'
                  categoria: BIOMÉDICO
                  nome_razao_social: JOÃO DOS SANTOS SILVA
      parameters:
        - name: nome_razao_social
          in: query
          description: ''
          required: true
          schema:
            type: string
          example: joao silva
      servers:
        - url: https://consultar.io
