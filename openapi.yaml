  /api/v1/cpf/consultar:
    get:
      summary: Consultar CPF
      operationId: >-
        users_gabriel_barros_documents_bruno_apis_api_cpf_data_de_nascimento_consultar_cpf_yml
      description: |-
        ## Consultar CPF

        **(Consultar pelo CPF e Data de Nascimento)**

        Consulta detalhes de um CPF específico.
      tags:
        - API CPF + Data de Nascimento
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpf:
                    type: string
                  nome:
                    type: string
                  data_nascimento:
                    type: string
                  situacao:
                    type: string
                  data_inscricao:
                    type: string
                  digito_verificador:
                    type: string
                  codigo_controle:
                    type: string
                  data_emissao:
                    type: string
                  hora_emissao:
                    type: string
                  qrcode_url:
                    type: string
              example:
                cpf: '12345678900'
                nome: MARIA DA SILVA SANTOS
                data_nascimento: '1990-01-01'
                situacao: REGULAR
                data_inscricao: '2005-03-15'
                digito_verificador: '00'
                codigo_controle: 2406.5A89.0E54.747B
                data_emissao: '2024-05-09'
                hora_emissao: '12:05:47'
                qrcode_url: >-
                  https://servicos.receita.fazenda.gov.br/Servicos/CPF/ca/ResultadoAut.asp?cp=12345678900&cc=24065A890E54747B&de=09052024&he=120547&dv=00&em=01
      parameters:
        - name: cpf
          in: query
          description: ''
          required: true
          schema:
            type: integer
            format: int64
          example: '87135740009'
        - name: data_nascimento
          in: query
          description: ''
          required: true
          schema:
            type: string
          example: '1990-01-01'
      servers:
        - url: https://consultar.io
  /api/v1/crbm/buscar:
