  /api/v2/cep/consultar:
    get:
      summary: Consultar CEP
      operationId: users_gabriel_barros_documents_bruno_apis_api_cep_consultar_cep_yml
      description: |-
        ## Consultar CEP

        **(Consultar pelo CEP)**

        Consulta detalhes de um CEP específico.
      tags:
        - API CEP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cep:
                    type: string
                  cep_formatado:
                    type: string
                  tipo:
                    type: string
                  caixa_postal:
                    type: boolean
                  nome:
                    type: string
                    nullable: true
                  nome_abreviado:
                    type: string
                    nullable: true
                  tipo_logradouro:
                    type: string
                  nome_logradouro:
                    type: string
                  logradouro:
                    type: string
                  complemento:
                    type: string
                  bairro:
                    type: string
                  bairro_abreviado:
                    type: string
                  localidade:
                    type: string
                  uf:
                    type: string
              example:
                cep: '04571000'
                cep_formatado: 04571-000
                tipo: Logradouro
                caixa_postal: false
                nome: null
                nome_abreviado: null
                tipo_logradouro: Avenida
                nome_logradouro: Engenheiro Luiz Carlos Berrini
                logradouro: Avenida Engenheiro Luiz Carlos Berrini
                complemento: '- até 99998 - lado par'
                bairro: Cidade Monções
                bairro_abreviado: Cid Monções
                localidade: São Paulo
                uf: SP
      parameters:
        - name: cep
          in: query
          description: ''
          required: true
          schema:
            type: integer
            format: int32
          example: '04571000'
      servers:
        - url: https://consultar.io
