        **(Buscar pelo Endereço)**

        Consulta detalhes de um CEP específico.
      tags:
        - API CEP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cep:
                      type: string
                    cep_formatado:
                      type: string
                    tipo:
                      type: string
                    caixa_postal:
                      type: boolean
                    nome:
                      type: string
                      nullable: true
                    nome_abreviado:
                      type: string
                      nullable: true
                    tipo_logradouro:
                      type: string
                    nome_logradouro:
                      type: string
                    logradouro:
                      type: string
                    complemento:
                      type: string
                    bairro:
                      type: string
                    bairro_abreviado:
                      type: string
                    localidade:
                      type: string
                    uf:
                      type: string
              example:
                - cep: '04571010'
                  cep_formatado: 04571-010
                  tipo: Logradouro
                  caixa_postal: false
                  nome: null
                  nome_abreviado: null
                  tipo_logradouro: Avenida
                  nome_logradouro: Engenheiro Luiz Carlos Berrini
                  logradouro: Avenida Engenheiro Luiz Carlos Berrini
                  complemento: '- até 1405 - lado ímpar'
                  bairro: Cidade Monções
                  bairro_abreviado: Cid Monções
                  localidade: São Paulo
                  uf: SP
                - cep: '04571011'
                  cep_formatado: 04571-011
                  tipo: Logradouro
                  caixa_postal: false
                  nome: null
                  nome_abreviado: null
                  tipo_logradouro: Avenida
                  nome_logradouro: Engenheiro Luiz Carlos Berrini
                  logradouro: Avenida Engenheiro Luiz Carlos Berrini
